aid: dabchy
name: Dabchy
description: Dabchy is a Tunisia-based online marketplace for buying and selling pre-owned and new
  lifestyle goods including fashion and clothing, accessories, home decor, sporting equipment, and
  books. Serving the Tunisian market in French (fr_TN), it lets individuals list their own items and
  discover deals from other sellers, positioning itself as a simple, fast, and secure platform for
  giving everyday objects a second life. Backed by 500 Global. As of this enrichment pass Dabchy
  publishes no public developer API, API documentation, developer portal, or machine-readable
  discovery surface; api.dabchy.com is a locked-down (HTTP 403) application backend and the public
  site is a client-rendered single-page app with no exposed spec.
